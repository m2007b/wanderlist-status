name: Save status snapshot
on:
  workflow_run:
    workflows: [Uptime CI]
    types: [completed]
    branches: [master]
permissions:
  contents: write
  issues: read
concurrency:
  group: status-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - name: Save checked states and public incidents
        id: snapshot
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const run = context.payload.workflow_run;
            const checkedAt = run.run_started_at;
            if (!Number.isFinite(Date.parse(checkedAt))) throw new Error('Missing check time');
            const file = 'status-live.json';
            if (fs.existsSync(file) && Date.parse(JSON.parse(fs.readFileSync(file, 'utf8')).checkedAt) >= Date.parse(checkedAt)) return;
            const services = ['website', 'blog', 'trip-data', 'ai-connections'].map(slug => {
              const text = fs.readFileSync(`history/${slug}.yml`, 'utf8');
              const status = text.match(/^status:\s*(up|down|degraded)\s*$/m)?.[1];
              if (!status) throw new Error(`Missing status for ${slug}`);
              return {slug, status};
            });
            let incidents = null;
            try {
              const result = await github.rest.issues.listForRepo({...context.repo, state: 'all', labels: 'status', per_page: 100});
              incidents = result.data.filter(item => !item.pull_request).map(({title, html_url, created_at, state}) => ({title, html_url, created_at, state}));
            } catch (error) { core.warning('Incident snapshot unavailable; availability results will still be saved.'); }
            fs.writeFileSync(file, JSON.stringify({checkedAt, conclusion: 'success', runId: run.id, services, incidents}, null, 2) + '\n');
            core.setOutput('saved', 'true');
      - name: Commit snapshot
        run: |
          git config user.name 'Wanderlist Status Bot'
          git config user.email '263143528+m2007b@users.noreply.github.com'
          git add status-live.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save monitoring snapshot [skip ci]'
          git push origin HEAD:master
      - name: Confirm saved check to external watchdog
        if: steps.snapshot.outputs.saved == 'true'
        env:
          STATUS_HEARTBEAT_URL: ${{ secrets.STATUS_HEARTBEAT_URL }}
        run: |
          if [ -z "$STATUS_HEARTBEAT_URL" ]; then
            echo '::warning::External missed-check alerts are not configured. Set STATUS_HEARTBEAT_URL to enable them.'
            exit 0
          fi
          case "$STATUS_HEARTBEAT_URL" in
            https://hc-ping.com/*) ;;
            *) echo '::error::Expected a Healthchecks.io HTTPS ping URL'; exit 1 ;;
          esac
          curl --fail --silent --show-error --retry 2 --max-time 10 "$STATUS_HEARTBEAT_URL" > /dev/null
