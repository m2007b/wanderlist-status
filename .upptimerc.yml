# Independent Wanderlist monitoring; no private application secrets are needed.
owner: m2007b
repo: wanderlist-status
user-agent: m2007b
secrets: []
skipDeleteIssues: true

sites:
  - name: Wanderlist Website
    slug: website
    url: https://www.wanderlist.net
    expectedStatusCodes: [200]
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: Wanderlist
  - name: Wanderlist Blog
    slug: blog
    url: https://www.wanderlist.net/api/blogs
    expectedStatusCodes: [200]
    maxResponseTime: 10000
    __dangerous__body_down_if_regex_missing: '"posts"\s*:\s*\['
  - name: Wanderlist Trip Data
    slug: trip-data
    url: https://www.wanderlist.net/api/trips/templates
    expectedStatusCodes: [200]
    maxResponseTime: 10000
    __dangerous__body_down_if_regex_missing: '"templates"\s*:\s*\['
  - name: Wanderlist AI Connections
    slug: ai-connections
    url: https://www.wanderlist.net/.well-known/oauth-authorization-server
    expectedStatusCodes: [200]
    maxResponseTime: 10000
    __dangerous__body_down_if_regex_missing: '"issuer"\s*:\s*"https://www\.wanderlist\.net/?"'

workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "17 * * * *"
  summary: "27 * * * *"
  graphs: "37 */6 * * *"
  staticSite: "47 */6 * * *"
  updateTemplate: "7 3 * * 1"
  updates: "7 4 * * 1"

status-website:
  cname: status.wanderlist.net
  logoUrl: https://status.wanderlist.net/wanderlist-logo.png
  logoHref: https://www.wanderlist.net
  favicon: https://status.wanderlist.net/favicon.png
  faviconSvg: https://status.wanderlist.net/favicon.svg
  name: Wanderlist Service Status
  customHeadHtml: '<script type="module" src="https://status.wanderlist.net/monitor-freshness.js"></script>'
  customBodyHtml: '<aside id="wanderlist-freshness" class="container freshness" role="status" aria-live="polite">Checking when monitoring last ran…</aside>'
  theme: light
  links:
    - rel: stylesheet
      href: https://status.wanderlist.net/wanderlist-theme.css
  introTitle: "A clear view of **Wanderlist’s services.**"
  introMessage: >-
    Check availability, response times, and incident updates below.
    Checks are scheduled every five minutes; execution and page updates may be delayed.
    Blog and trip-data checks include database reads. AI Connections checks connection
    discovery, not AI trip generation or a complete sign-in flow.
  navbar:
    - title: Status
      href: /
    - title: Back to Wanderlist
      href: https://www.wanderlist.net
    - title: Get help
      href: https://www.wanderlist.net/contact
  metaTags:
    - name: description
      content: Availability, response times, and incident updates for Wanderlist services.
    - name: theme-color
      content: "#06254f"

i18n:
  allSystemsOperational: No active incidents reported
  footer: "[Wanderlist](https://www.wanderlist.net) · [Contact support](https://www.wanderlist.net/contact) · Monitoring powered by [Upptime](https://upptime.js.org)"

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
